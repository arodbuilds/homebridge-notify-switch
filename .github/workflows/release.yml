name: Release

# Publishes to npm when a GitHub release is published (SPEC section 13, item 5).
# A release marked as a pre-release goes to the `beta` dist-tag; a full release goes to `latest`.

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for `npm publish --provenance` (Sigstore signing through GitHub's OIDC token).
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Update npm for trusted publishing
        # npm trusted publishing needs npm 11.5.1 or newer. The npm bundled with the Node.js version above can
        # be older than that, so upgrade before publishing and fail early if the result is still too old.
        run: |
          npm install -g npm@latest
          version="$(npm --version)"
          echo "npm $version"
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "npm $version is older than 11.5.1, which trusted publishing requires" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public --tag ${{ github.event.release.prerelease && 'beta' || 'latest' }}
